name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build static binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w" -o dist/proot-linux-arm64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o dist/proot-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -ldflags "-s -w" -o dist/proot-linux-armv7 .
          (cd dist && sha256sum proot-linux-* > checksums.txt)
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/proot-linux-arm64
            dist/proot-linux-amd64
            dist/proot-linux-armv7
            dist/checksums.txt
          generate_release_notes: true
